name: GitHub Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-ohos:
    uses: ./.github/workflows/ohos-build.yml

  release:
    needs: build-ohos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: passkeys-ohos-hap
          path: dist

      - name: Write checksums
        working-directory: dist
        run: sha256sum passkeys-ohos-example-unsigned.hap > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/passkeys-ohos-example-unsigned.hap dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes 'HarmonyOS NEXT FIDO2 plugin source is in this tag. The attached unsigned HAP is a standalone integration example; sign it for your own app and relying party.'
