name: passkeys
description: Flutter plugin enabling simple passkey authentication. Can be either used with a ready-to-use relying party server (Corbado) or with your custom relying party.
homepage: https://docs.corbado.com/overview/welcome
repository: https://github.com/corbado/flutter-passkeys/tree/main/packages/passkeys/passkeys
version: 2.23.1
publish_to: none

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

resolution: workspace

flutter:
  plugin:
    platforms:
      android:
        default_package: passkeys_android
      ios:
        default_package: passkeys_darwin
      macos:
        default_package: passkeys_darwin
      ohos:
        default_package: passkeys_ohos
      web:
        default_package: passkeys_web
      windows:
        default_package: passkeys_windows

dependencies:
  convert: ^3.1.1
  flutter:
    sdk: flutter
  json_annotation: ^4.8.1
  passkeys_android:
    path: ../passkeys_android
  passkeys_darwin:
    path: ../passkeys_darwin
  passkeys_doctor:
    path: ../passkeys_doctor
  passkeys_ohos:
    path: ../passkeys_ohos
  passkeys_platform_interface:
    path: ../passkeys_platform_interface
  passkeys_web:
    path: ../passkeys_web
  passkeys_windows:
    path: ../passkeys_windows

dev_dependencies:
  build_runner: ^2.4.5
  flutter_test:
    sdk: flutter
  json_serializable: ^6.7.0
  mocktail: ^1.0.0
  plugin_platform_interface: ^2.0.0
  very_good_analysis: ^5.0.0
